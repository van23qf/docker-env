# ============================================================
# Redis 7 配置
# 数据目录 /data (映射到宿主机 ./data/redis)。
# 日志目录 /logs  (映射到宿主机 ./logs/redis)。
# ============================================================

# ---------- 网络 ----------
bind 0.0.0.0
protected-mode yes
port 6379

# ---------- 认证 ----------
# 密码通过 docker-compose 的 command (--requirepass) 从 .env 的
# REDIS_PASSWORD 传入，不在此处硬编码，避免把密码提交到 git。
# requirepass your-password-here

# ---------- 内存 ----------
maxmemory 256mb
maxmemory-policy allkeys-lru

# ---------- 持久化 (AOF) ----------
appendonly yes
appendfsync everysec

# ---------- 日志 ----------
loglevel notice
logfile /logs/redis.log

# ---------- 数据目录 ----------
dir /data
